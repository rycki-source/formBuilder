services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: formbuilder
      POSTGRES_USER: fb_user
      POSTGRES_PASSWORD: fb_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fb_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fb_user:fb_password@postgres:5432/formbuilder
      REDIS_URL: redis://redis:6379
      SECRET_KEY: "your-secret-key-change-this"
      PEPPER: "pepper-change-this"
      ENVIRONMENT: development
      DEBUG: "True"
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:5174","http://localhost:8000"]'
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  minio_data: